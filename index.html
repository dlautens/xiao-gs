<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HT-G4 ground station</title>
  <style>
    body { font-family: sans-serif; margin: 1rem; max-width: 40rem; }
    table { border-collapse: collapse; width: 100%; }
    td { padding: .15rem .4rem; border-bottom: 1px solid #ddd; font-family: monospace; }
    .ok { color: #0a0; }
    .bad { color: #a00; font-weight: bold; }
    .warn { color: #b60; }
    button { font-size: 1rem; padding: .4rem .8rem; margin: .2rem .2rem 0 0; }
    #flight-state { font-size: 1.4rem; font-weight: bold; }
    #pin a { display: inline-block; margin: .4rem .6rem 0 0; font-size: 1.15rem; }
  </style>
</head>
<body>
  <h1>HT-G4 ground station</h1>
  <p>Chrome on Android over HTTPS. Web Bluetooth to the Heltec ground station (XIAO-GS).</p>
  <p>
    <button id="btn" type="button">Connect XIAO-GS</button>
    <span id="st">idle</span>
  </p>
  <div id="flags"></div>
  <div id="pin">no position yet</div>
  <h2>Link</h2>
  <table id="link"></table>
  <h2>Packet</h2>
  <table id="pkt"><tr><td>no packet</td></tr></table>
  <p id="err" class="bad"></p>
  <h2>Flight</h2>
  <p id="flight-state">armed</p>
  <p id="flight-detail"></p>
  <p>
    <button id="ack" type="button">Ack warns</button>
    <button id="arm" type="button">Arm</button>
    <button id="disarm" type="button">Disarm</button>
    <button id="sim-on" type="button">Sim on</button>
    <button id="sim-off" type="button">Sim off</button>
    <button id="boost" type="button">Sim boost</button>
    <button id="wake" type="button">Wake BLE</button>
  </p>
  <h2>Flight log</h2>
  <p>Separate radio from XIAO-GS. The XIAO flight computer (XIAO-LOG), disarmed and on the ground.</p>
  <p>
    <button id="log-btn" type="button">Download from XIAO-LOG</button>
    <button id="log-save" type="button">Save file</button>
    <span id="log-st">idle</span>
  </p>
  <p id="log-err" class="bad"></p>
  <!-- Generated codec (proto/gen/htg4_msg.js) and the envelope parser, served beside this page.
       log_download.js is the XIAO log transfer. It does not share the XIAO-GS connection. -->
  <script src="htg4_msg.js"></script>
  <script src="gs_envelope.js"></script>
  <script src="flight_cmd.js"></script>
  <script src="log_download.js"></script>
<script>
(function () {
  "use strict";
  /* Same UUIDs as firmware/apps/gs/main/gs_ble.hpp (and xiao-tracker ui_ble.h). */
  const SVC = "8aa1a001-c0de-4b1e-9a11-58414f2d4753";
  const DOWN = "8aa1a002-c0de-4b1e-9a11-58414f2d4753";
  const UP = "8aa1a003-c0de-4b1e-9a11-58414f2d4753";
  let upChar = null;
  let holdArmed = false;
  const PENDING_KEY = "htg4.flight.pending";
  function loadPending() {
    try {
      const raw = sessionStorage.getItem(PENDING_KEY);
      if (!raw) return null;
      const saved = JSON.parse(raw);
      if (!saved || typeof saved.name !== "string" || !Array.isArray(saved.bytes)) return null;
      return { name: saved.name, bytes: Uint8Array.from(saved.bytes) };
    } catch (e) {
      return null;
    }
  }
  function storePending(value) {
    try {
      if (!value) sessionStorage.removeItem(PENDING_KEY);
      else sessionStorage.setItem(PENDING_KEY, JSON.stringify({ name: value.name, bytes: Array.from(value.bytes) }));
    } catch (e) { /* private mode keeps the in-memory copy only */ }
  }
  /* A reload or a BLE reconnect that reloads the page used to drop this and paint "safe"
   * from the next beacon, while the Heltec still had the uplink queued. */
  let pending = loadPending();
  const WIRE = HTG4Msg.TABLE.wire.find(function (l) { return l.name === "lora_packet"; });
  const loss = new GsEnvelope.LossCounter();
  const repeats = new GsEnvelope.RepeatFilter();
  const $ = function (id) { return document.getElementById(id); };
  if (pending) {
    $("flight-state").textContent = FlightCmd.flightLabel({ pending: pending.name, fresh: false, phase: null });
  }

  function setSt(t, ok) {
    $("st").textContent = t;
    $("st").className = ok === true ? "ok" : ok === false ? "bad" : "";
  }

  function rows(el, list) {
    el.innerHTML = "";
    list.forEach(function (r) {
      const tr = document.createElement("tr");
      const a = document.createElement("td");
      const b = document.createElement("td");
      a.textContent = r[0];
      b.textContent = r[1];
      if (r[2]) b.className = r[2];
      tr.appendChild(a);
      tr.appendChild(b);
      el.appendChild(tr);
    });
  }

  function fieldText(f, v) {
    if (f.bits) {
      const names = HTG4Msg.bitNames(f, v);
      return "0x" + Number(v).toString(16) + (names.length ? " [" + names.join(", ") + "]" : "");
    }
    if (f.enum) return String(HTG4Msg.enumName(f, v) || v);
    const unit = f.unit && f.unit !== "1" ? " " + f.unit : "";
    return (typeof v === "number" && !Number.isInteger(v) ? v.toFixed(2) : String(v)) + unit;
  }

  function render(env) {
    $("err").textContent = "";
    if (env.err) {
      if (!env.skip) $("err").textContent = env.err;
      return;
    }
    const stale = env.ageS === null || env.ageS > GsEnvelope.STALE_AFTER_S;
    const fresh = repeats.isNew(env);
    rows($("link"), [
      ["last packet", env.ageS === null ? "none yet" : (fresh ? "NEW" : "repeat") + ", age " + env.ageS.toFixed(1) + " s" +
        (stale ? " STALE" : ""), stale ? "bad" : (fresh ? "ok" : "")],
      ["RSSI", env.rssiDbm + " dBm"],
      ["SNR", env.snrDb.toFixed(2) + " dB"],
      ["received", String(env.rxOk)],
      ["RX errors (CRC/header)", String(env.rxErr), env.rxErr ? "warn" : ""],
      ["rejected (format/version, A21-4)", String(env.rxRejected), env.rxRejected ? "bad" : ""],
      ["loss (seq gaps)", loss.missed + " (" + loss.percent().toFixed(1) + " %)", loss.missed ? "warn" : ""],
    ]);
    if (!fresh) {
      if (stale) showFlight(null, false);
      return; // keepalive repeat: link rows updated above, packet view unchanged
    }
    let p;
    try {
      p = HTG4Msg.decodeWire("lora_packet", env.packet);
    } catch (e) {
      $("err").textContent = String(e.message || e);
      return;
    }
    loss.add(p.seq);
    rows($("pkt"), WIRE.fields.map(function (f) {
      const bad = (f.name === "health" && p.health) || (f.name === "flags" && (p.flags & 1));
      return [f.name, fieldText(f, p[f.name]), bad ? "bad" : ""];
    }));
    const flags = WIRE.fields.find(function (f) { return f.name === "flags"; });
    const health = WIRE.fields.find(function (f) { return f.name === "health"; });
    const set = HTG4Msg.bitNames(flags, p.flags);
    const faults = HTG4Msg.bitNames(health, p.health);
    const msgs = [];
    if (set.indexOf("guide_stale") >= 0) msgs.push("GUIDE STALE (field " + p.guide_age_ds + ")");
    if (set.indexOf("gps_valid") < 0) msgs.push("no current GPS fix");
    if (faults.length) msgs.push("faults: " + faults.join(", "));
    $("flags").className = msgs.length ? "bad" : "ok";
    $("flags").textContent = msgs.length ? msgs.join(" | ") : "no faults";
    const INT32_MIN = -2147483648;
    if (p.lat_e7 !== INT32_MIN && p.lon_e7 !== INT32_MIN) {
      const q = (p.lat_e7 / 1e7).toFixed(6) + "," + (p.lon_e7 / 1e7).toFixed(6);
      const label = encodeURIComponent(q + " (HT-G4)");
      $("pin").innerHTML = "<strong>" + (set.indexOf("gps_valid") >= 0 ? "Pin " : "Last pin (not current) ") + q +
        "</strong><br><a href=\"geo:" + q + "?q=" + label + "\">Open pin in Maps</a>" +
        "<a href=\"https://maps.google.com/?q=" + encodeURIComponent(q) + "\">Google Maps pin</a>";
    } else {
      $("pin").textContent = "no fix seen yet, no pin";
    }
    showFlight(p, true);
  }

  function showFlight(p, fresh) {
    const phase = fresh && p ? p.phase : null;
    const flags = fresh && p ? p.flags : 0;
    if (fresh && p && (flags & FlightCmd.FLAG.guide_stale)) FlightCmd.noteEcho(p.guide_age_ds, true);
    if (fresh && p) holdArmed = p.phase === FlightCmd.PHASE.armed_pad;
    const step = FlightCmd.afterDownlink(pending ? pending.name : null, phase, flags, fresh && !!p);
    if (pending && step.pending == null) {
      pending = null;
      storePending(null);
    }
    $("flight-state").textContent = step.label;
    const names = [];
    if (fresh && p) {
      const status = FlightCmd.commandStatus(flags);
      if (status) names.push(status);
      if ((flags & FlightCmd.FLAG.sim) !== 0) names.push("sim");
      if ((flags & FlightCmd.FLAG.ble_on) !== 0) names.push("ble on");
    }
    $("flight-detail").textContent = "counter " + FlightCmd.loadCounter() +
      (names.length ? "  " + names.join(" ") : "");
  }

  async function writeUp(bytes) {
    if (!upChar) return;
    if (upChar.writeValueWithoutResponse) await upChar.writeValueWithoutResponse(bytes);
    else await upChar.writeValue(bytes);
  }

  async function send(name, wake) {
    if (!upChar) {
      $("flight-detail").textContent = "connect XIAO-GS first";
      return;
    }
    const counter = FlightCmd.takeCounter();
    const bytes = FlightCmd.encodeCommand(name, counter, wake || 0, HTG4Msg);
    pending = { name: name, bytes: bytes };
    storePending(pending);
    $("flight-state").textContent = FlightCmd.flightLabel({
      pending: name, fresh: false, phase: null,
    });
    try { await writeUp(bytes); } catch (e) { $("err").textContent = String(e.message || e); }
  }

  async function sendHold() {
    if (!upChar || pending || !holdArmed) return;
    const counter = FlightCmd.takeCounter();
    try { await writeUp(FlightCmd.encodeCommand("hold", counter, 0, HTG4Msg)); } catch (e) { /* next period */ }
  }

  function onValue(ev) {
    const val = ev.target.value;
    if (val) render(GsEnvelope.parse(val));
  }

  // HIL only: the runner serves this page on 127.0.0.1 with ?hil=1 and has already
  // granted one device. getDevices() does not open the chooser. Any other host,
  // including the public page, keeps requestDevice() below.
  function hilTestMode() {
    const host = location.hostname;
    if (host !== "127.0.0.1" && host !== "localhost") return false;
    return new URLSearchParams(location.search).get("hil") === "1";
  }

  async function subscribe(dev) {
    setSt("connecting " + (dev.name || ""), true);
    const server = await dev.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    const down = await svc.getCharacteristic(DOWN);
    upChar = await svc.getCharacteristic(UP);
    await down.startNotifications();
    down.addEventListener("characteristicvaluechanged", onValue);
    try {
      render(GsEnvelope.parse(await down.readValue()));
    } catch (e) { /* the notify path is enough */ }
    dev.addEventListener("gattserverdisconnected", function () {
      upChar = null;
      setSt("disconnected", false);
    });
    setSt("subscribed", true);
  }

  async function connect() {
    if (!navigator.bluetooth) {
      setSt("no Web Bluetooth (need Chrome, HTTPS)", false);
      return;
    }
    try {
      if (hilTestMode()) {
        const wanted = new URLSearchParams(location.search).get("ble_name") || "";
        if (!wanted) {
          setSt("test mode: no device name", false);
          return;
        }
        if (typeof navigator.bluetooth.getDevices !== "function") {
          setSt("test mode: no getDevices", false);
          return;
        }
        setSt("test mode");
        const devices = await navigator.bluetooth.getDevices();
        const dev = devices.find(function (d) { return d.name === wanted; });
        if (!dev) {
          setSt("test mode: " + wanted + " is not granted", false);
          return;
        }
        await subscribe(dev);
        return;
      }
      setSt("picker...");
      const dev = await navigator.bluetooth.requestDevice({
        filters: [{ name: "XIAO-GS" }, { services: [SVC] }],
        optionalServices: [SVC],
      });
      await subscribe(dev);
    } catch (e) {
      setSt(String(e), false);
    }
  }

  $("btn").addEventListener("click", connect);
  $("ack").addEventListener("click", function () { send("ack", 0); });
  $("arm").addEventListener("click", function () { send("arm", 0); });
  $("disarm").addEventListener("click", function () { send("disarm", 0); });
  $("sim-on").addEventListener("click", function () { send("sim_set", 0); });
  $("sim-off").addEventListener("click", function () { send("sim_clear", 0); });
  $("boost").addEventListener("click", function () { send("sim_boost", 0); });
  $("wake").addEventListener("click", function () { send("ble_wake", FlightCmd.WAKE_BLE); });
  let holdTicks = 0;
  setInterval(function () {
    holdTicks += 1;
    if (pending) writeUp(pending.bytes).catch(function () {});
    else if (holdTicks % 20 === 0) sendHold();
  }, 1000);
})();
LogDownload.bind({ button: "log-btn", save: "log-save", status: "log-st", error: "log-err" });
</script>
</body>
</html>
