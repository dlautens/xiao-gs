<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HT-G4 ground station</title>
  <style>
    body { font-family: sans-serif; margin: 1rem; max-width: 40rem; }
    table { border-collapse: collapse; width: 100%; }
    td { padding: .15rem .4rem; border-bottom: 1px solid #ddd; font-family: monospace; }
    .ok { color: #0a0; }
    .bad { color: #a00; font-weight: bold; }
    .warn { color: #b60; }
    button { font-size: 1rem; padding: .4rem .8rem; }
    #pin a { display: inline-block; margin: .4rem .6rem 0 0; font-size: 1.15rem; }
  </style>
</head>
<body>
  <h1>HT-G4 ground station</h1>
  <p>Chrome on Android over HTTPS. Web Bluetooth to the Heltec ground station (XIAO-GS).</p>
  <p>
    <button id="btn" type="button">Connect XIAO-GS</button>
    <span id="st">idle</span>
  </p>
  <div id="flags"></div>
  <div id="pin">no position yet</div>
  <h2>Link</h2>
  <table id="link"></table>
  <h2>Packet</h2>
  <table id="pkt"><tr><td>no packet</td></tr></table>
  <p id="err" class="bad"></p>
  <!-- Generated codec (proto/gen/htg4_msg.js) and the envelope parser, served beside this page. -->
  <script src="htg4_msg.js"></script>
  <script src="gs_envelope.js"></script>
<script>
(function () {
  "use strict";
  /* Same UUIDs as firmware/apps/gs/main/gs_ble.hpp (and xiao-tracker ui_ble.h). */
  const SVC = "8aa1a001-c0de-4b1e-9a11-58414f2d4753";
  const DOWN = "8aa1a002-c0de-4b1e-9a11-58414f2d4753";
  const WIRE = HTG4Msg.TABLE.wire.find(function (l) { return l.name === "lora_packet"; });
  const loss = new GsEnvelope.LossCounter();
  const repeats = new GsEnvelope.RepeatFilter();
  const $ = function (id) { return document.getElementById(id); };

  function setSt(t, ok) {
    $("st").textContent = t;
    $("st").className = ok === true ? "ok" : ok === false ? "bad" : "";
  }

  function rows(el, list) {
    el.innerHTML = "";
    list.forEach(function (r) {
      const tr = document.createElement("tr");
      const a = document.createElement("td");
      const b = document.createElement("td");
      a.textContent = r[0];
      b.textContent = r[1];
      if (r[2]) b.className = r[2];
      tr.appendChild(a);
      tr.appendChild(b);
      el.appendChild(tr);
    });
  }

  function fieldText(f, v) {
    if (f.bits) {
      const names = HTG4Msg.bitNames(f, v);
      return "0x" + Number(v).toString(16) + (names.length ? " [" + names.join(", ") + "]" : "");
    }
    if (f.enum) return String(HTG4Msg.enumName(f, v) || v);
    const unit = f.unit && f.unit !== "1" ? " " + f.unit : "";
    return (typeof v === "number" && !Number.isInteger(v) ? v.toFixed(2) : String(v)) + unit;
  }

  function render(env) {
    $("err").textContent = "";
    if (env.err) {
      if (!env.skip) $("err").textContent = env.err;
      return;
    }
    const stale = env.ageS === null || env.ageS > GsEnvelope.STALE_AFTER_S;
    const fresh = repeats.isNew(env);
    rows($("link"), [
      ["last packet", env.ageS === null ? "none yet" : (fresh ? "NEW" : "repeat") + ", age " + env.ageS.toFixed(1) + " s" +
        (stale ? " STALE" : ""), stale ? "bad" : (fresh ? "ok" : "")],
      ["RSSI", env.rssiDbm + " dBm"],
      ["SNR", env.snrDb.toFixed(2) + " dB"],
      ["received", String(env.rxOk)],
      ["CRC errors", String(env.rxCrcErr), env.rxCrcErr ? "warn" : ""],
      ["rejected (format/version, A21-4)", String(env.rxRejected), env.rxRejected ? "bad" : ""],
      ["loss (seq gaps)", loss.missed + " (" + loss.percent().toFixed(1) + " %)", loss.missed ? "warn" : ""],
    ]);
    if (!fresh) return; // keepalive repeat: link rows updated above, packet view unchanged
    let p;
    try {
      p = HTG4Msg.decodeWire("lora_packet", env.packet);
    } catch (e) {
      $("err").textContent = String(e.message || e);
      return;
    }
    loss.add(p.seq);
    rows($("pkt"), WIRE.fields.map(function (f) {
      const bad = (f.name === "health" && p.health) || (f.name === "flags" && (p.flags & 1));
      return [f.name, fieldText(f, p[f.name]), bad ? "bad" : ""];
    }));
    const flags = WIRE.fields.find(function (f) { return f.name === "flags"; });
    const health = WIRE.fields.find(function (f) { return f.name === "health"; });
    const set = HTG4Msg.bitNames(flags, p.flags);
    const faults = HTG4Msg.bitNames(health, p.health);
    const msgs = [];
    if (set.indexOf("guide_stale") >= 0) msgs.push("GUIDE STALE (age " + (p.guide_age_ds / 10).toFixed(1) + " s)");
    if (set.indexOf("gps_valid") < 0) msgs.push("no current GPS fix");
    if (faults.length) msgs.push("faults: " + faults.join(", "));
    $("flags").className = msgs.length ? "bad" : "ok";
    $("flags").textContent = msgs.length ? msgs.join(" | ") : "no faults";
    const INT32_MIN = -2147483648;
    if (p.lat_e7 !== INT32_MIN && p.lon_e7 !== INT32_MIN) {
      const q = (p.lat_e7 / 1e7).toFixed(6) + "," + (p.lon_e7 / 1e7).toFixed(6);
      const label = encodeURIComponent(q + " (HT-G4)");
      $("pin").innerHTML = "<strong>" + (set.indexOf("gps_valid") >= 0 ? "Pin " : "Last pin (not current) ") + q +
        "</strong><br><a href=\"geo:" + q + "?q=" + label + "\">Open pin in Maps</a>" +
        "<a href=\"https://maps.google.com/?q=" + encodeURIComponent(q) + "\">Google Maps pin</a>";
    } else {
      $("pin").textContent = "no fix seen yet, no pin";
    }
  }

  function onValue(ev) {
    const val = ev.target.value;
    if (val) render(GsEnvelope.parse(val));
  }

  async function connect() {
    if (!navigator.bluetooth) {
      setSt("no Web Bluetooth (need Chrome, HTTPS)", false);
      return;
    }
    setSt("picker...");
    try {
      const dev = await navigator.bluetooth.requestDevice({
        filters: [{ name: "XIAO-GS" }, { services: [SVC] }],
        optionalServices: [SVC],
      });
      setSt("connecting " + (dev.name || ""), true);
      const server = await dev.gatt.connect();
      const svc = await server.getPrimaryService(SVC);
      const down = await svc.getCharacteristic(DOWN);
      await down.startNotifications();
      down.addEventListener("characteristicvaluechanged", onValue);
      try {
        render(GsEnvelope.parse(await down.readValue()));
      } catch (e) { /* the notify path is enough */ }
      dev.addEventListener("gattserverdisconnected", function () { setSt("disconnected", false); });
      setSt("subscribed", true);
    } catch (e) {
      setSt(String(e), false);
    }
  }

  $("btn").addEventListener("click", connect);
})();
</script>
</body>
</html>
