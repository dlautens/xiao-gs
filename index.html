<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HT-G4 ground station</title>
  <!-- The phone page: a viewer. Used outdoors on an Android phone in Chrome,
       often one-handed, so type is large, tap targets are at least 48 px, and every colour also
       carries a word or an icon. Self-contained: it loads only the three scripts beside it. -->
  <style>
    :root {
      --ground: #ebe8e1; --card: #fff; --ink: #16181d; --dim: #4a4d55; --line: #ebe8e1;
      --safe: #0b5d1e; --armed: #a8001c; --flight: #0b3d91; --idle: #3a3d45; --amber: #8a4b00;
      --sim: #4c1d95; --bench: #ff8a00; --ematch: #ffd400;
    }
    * { box-sizing: border-box; margin: 0; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body { background: var(--ground); color: var(--ink); font: 17px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
      padding-bottom: 76px; overflow-wrap: anywhere; }
    .ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -.18em; margin-right: .35em; }
    #top { position: sticky; top: 0; z-index: 2; background: var(--ground); padding-bottom: 2px; }
    .pin { color: #fff; padding: 10px 16px 12px; border-radius: 0 0 18px 18px; }
    .t-safe, .t-landed { background: var(--safe); } .t-armed, .t-fault { background: var(--armed); }
    .t-flight { background: var(--flight); } .t-idle, .pin.stale { background: var(--idle); }
    .state { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 10px; }
    .state .ic { width: 30px; height: 30px; align-self: center; margin: 0; }
    .word { font-size: 38px; font-weight: 800; letter-spacing: .02em; line-height: 1.05; }
    .sub { font-size: 18px; font-weight: 600; }
    .lastknown { font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .linkline { display: flex; margin-top: 6px; font-weight: 600; }
    .linkline .ic { margin-top: .08em; }
    #btn { display: block; width: calc(100% - 32px); margin: 8px 16px 0; }
    .banner { margin: 8px 16px 0; padding: 6px 8px; border-radius: 12px; text-align: center; font-weight: 900; line-height: 1.15; }
    .b-sim { background: var(--sim); color: #fff; font-size: 34px; letter-spacing: .3em; text-indent: .3em; }
    .b-bench { background: var(--bench); color: #000; font-size: 24px; letter-spacing: .04em; border: 4px solid #000; }
    .b-fault { background: var(--armed); color: #fff; font-size: 20px; text-align: left; padding: 8px 12px; }
    .b-fault .what { display: flex; align-items: center; }
    .b-fault .ic { width: 30px; height: 30px; }
    .b-fault .reason { font-size: 18px; font-weight: 700; margin: 2px 0 0 40px; }
    .b-ematch { background: var(--ematch); color: #000; font-size: 22px; border: 8px solid;
      border-image: repeating-linear-gradient(135deg, #000 0 10px, var(--ematch) 10px 20px) 8; border-radius: 0; }
    main { padding: 0 16px 8px; }
    .view { display: none; } .view.on { display: block; }
    h2 { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 14px 4px 6px; font-weight: 700; }
    .count { display: inline-block; min-width: 1.6em; text-align: center; border-radius: 1em; padding: 0 .4em; margin-left: .3em; background: var(--ink); color: #fff; }
    .card { background: var(--card); border-radius: 12px; overflow: hidden; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--line); align-items: baseline; }
    .row:last-child { border-bottom: 0; }
    .row .k { color: var(--dim); flex: 0 1 auto; } .row .v { font-weight: 650; text-align: right; flex: 1 1 0; min-width: 40%; }
    .row .ic { color: var(--safe); } .row .v-warn .ic { color: var(--amber); } .row .v-stop .ic { color: var(--armed); }
    .item { display: flex; align-items: center; gap: 6px; min-height: 56px; background: var(--card); border-radius: 12px;
      padding: 4px 10px 4px 14px; margin-top: 6px; border-left: 8px solid var(--dim); }
    .item .ic { width: 26px; height: 26px; margin-right: 4px; }
    .item .name { flex: 1; font-size: 19px; font-weight: 700; }
    .item.stop { border-color: var(--armed); color: var(--armed); }
    .item.warn { border-color: var(--amber); } .item.warn .ic { color: var(--amber); }
    .item.acked { border-color: var(--safe); color: var(--safe); }
    .item.none { color: var(--dim); min-height: 48px; } .item.none .name { font-weight: 600; font-size: 17px; }
    .tag { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; text-align: right; }
    button, a.btn { font: inherit; font-weight: 800; background: var(--ink); color: #fff; border: 0; border-radius: 28px;
      min-height: 48px; min-width: 48px; padding: 0 20px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    .ack { min-width: 92px; font-size: 18px; }
    .big { display: flex; width: 100%; min-height: 60px; margin-top: 14px; font-size: 22px; }
    .ready { display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 56px; margin-top: 14px; padding: 6px 10px;
      border-radius: 12px; font-size: 18px; font-weight: 900; letter-spacing: .02em; text-align: center; }
    .ready .ic { width: 28px; height: 28px; }
    .cmdline { display: flex; margin-top: 6px; padding: 6px 8px; border-radius: 10px; background: #fff; color: var(--ink); font-weight: 700; }
    .cmdline .ic { margin-top: .08em; } .cmdline.c-holding .ic { color: var(--flight); } .cmdline.c-worked .ic { color: var(--safe); }
    .cmdline.c-refused, .cmdline.c-no_reply { color: var(--armed); }
    .cmdline .next { display: block; font-weight: 600; color: var(--ink); }
    .confirm { flex-wrap: nowrap; } .confirm .big { margin-top: 6px; }
    .big.arm { background: var(--armed); }
    .opts { flex-direction: column; }
    .opt { width: 100%; justify-content: flex-start; background: var(--card); color: var(--ink); border: 3px solid var(--ink); font-size: 18px; }
    .opt.on { background: var(--ink); color: #fff; }
    .ready.unknown { background: var(--idle); color: #fff; }
    .ready.yes { background: var(--safe); color: #fff; } .ready.no { background: var(--armed); color: #fff; }
    .big.refuse { background: var(--card); color: var(--ink); border: 3px solid var(--ink); font-size: 19px; }
    .note { margin: 8px 4px 0; font-size: 15px; color: var(--dim); }
    #log-st, #log-err { margin: 8px 4px 0; font-size: 15px; color: var(--dim); }
    #log-st.ok { color: var(--safe); font-weight: 700; } #log-st.bad, #log-err { color: var(--armed); font-weight: 700; }
    .links, .btns { display: flex; flex-wrap: wrap; gap: 8px; padding: 9px 14px; }
    .btns { padding: 0; margin-top: 8px; }
    #pkt .row { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; padding: 5px 14px; }
    #tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; gap: 4px; padding: 6px 8px; background: var(--card);
      border-top: 1px solid #cfcabf; }
    #tabs button { flex: 1; background: none; color: var(--dim); padding: 0; font-weight: 700; border-radius: 24px; }
    #tabs button.on { background: var(--ink); color: #fff; }
  </style>
</head>
<body>
  <div id="top">
    <div id="r-head"></div>
    <button id="btn" type="button">Connect ground station</button>
    <div id="r-banners"></div>
  </div>
  <main>
    <section class="view" id="v-pad">
      <div id="r-padLink"></div>
      <div id="r-padMain"></div>
    </section>
    <section class="view" id="v-flight"><div id="r-flight"></div></section>
    <section class="view" id="v-bench">
      <div id="r-bench"></div>
      <h2>Flight log</h2>
      <p class="note">A separate radio link to the XIAO flight computer (XIAO-LOG), disarmed and on the ground.</p>
      <div class="btns">
        <button id="log-btn" type="button">Download from XIAO-LOG</button>
        <button id="log-save" type="button">Save file</button>
        <button id="log-view" type="button">View flight</button>
        <button id="log-confirm" type="button">Confirm saved</button>
        <button id="log-discard" type="button">Discard log</button>
      </div>
      <p id="log-st">idle</p>
      <p id="log-err"></p>
      <div class="btns"><a class="btn" href="flight_review.html">Review a saved flight</a></div>
      <h2>Packet fields</h2>
      <div class="card" id="pkt"><div class="row"><span class="k">Packet</span><span class="v">no packet</span></div></div>
    </section>
    <section class="view" id="v-link">
      <h2>Link details</h2>
      <div class="card" id="link"></div>
      <div id="r-err"></div>
      <p class="note">Ground station Bluetooth: <span id="st">idle</span></p>
      <p class="note">Chrome on Android over HTTPS. Web Bluetooth to the Heltec ground station (XIAO-GS).</p>
    </section>
  </main>
  <nav id="tabs">
    <button type="button" data-view="pad">Pad</button>
    <button type="button" data-view="flight">Flight</button>
    <button type="button" data-view="bench">Bench</button>
    <button type="button" data-view="link">Link</button>
  </nav>
  <!-- Generated codec (proto/gen/htg4_msg.js) and the envelope parser and viewer, served beside this page.
       log_download.js is the XIAO log transfer. It does not share the XIAO-GS connection. -->
  <script src="htg4_msg.js?v=2575001"></script>
  <script src="gs_envelope.js?v=2575001"></script>
  <script src="log_download.js?v=2575001"></script>
<script>
(function () {
  "use strict";
  /* Same UUIDs as firmware/apps/gs/main/gs_ble.hpp (and xiao-tracker ui_ble.h). */
  const SVC = "8aa1a001-c0de-4b1e-9a11-58414f2d4753";
  const DOWN = "8aa1a002-c0de-4b1e-9a11-58414f2d4753";
  const UP = "8aa1a003-c0de-4b1e-9a11-58414f2d4753"; // command intents (apps/gs/README.md "Command contract")
  const $ = function (id) { return document.getElementById(id); };
  let viewer = new GsEnvelope.Viewer(HTG4Msg);
  let now = function () { return Date.now(); };
  const REGION = { pkt: "pkt", link: "link" }; // the other regions are r-<name>
  const shown = {};
  let up = null; // the up characteristic while connected
  let writing = Promise.resolve(); // one GATT write at a time

  // Writes a region only when its text changed, so a button is not replaced under a finger.
  function draw() {
    const r = viewer.regions(now());
    Object.keys(r).forEach(function (k) {
      if (shown[k] === r[k]) return;
      shown[k] = r[k];
      $(REGION[k] || "r-" + k).innerHTML = r[k];
    });
    GsEnvelope.VIEWS.forEach(function (v) {
      $("v-" + v).classList.toggle("on", v === viewer.view);
    });
    document.querySelectorAll("#tabs button").forEach(function (b) {
      const on = b.dataset.view === viewer.view;
      b.classList.toggle("on", on);
      if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    $("btn").hidden = viewer.ble === "connected" || viewer.ble === "connecting";
  }

  function feed(env) {
    viewer.onEnvelope(env, now());
    draw();
  }

  function setSt(t, ble) {
    $("st").textContent = t;
    if (ble) viewer.setBle(ble);
    draw();
  }

  // The selected view is the page's own state, kept in the address (#flight) so a reload keeps
  // it. Only a tab tap changes it.
  $("tabs").addEventListener("click", function (ev) {
    const b = ev.target.closest("button[data-view]");
    if (!b) return;
    viewer.selectView(b.dataset.view);
    history.replaceState(null, "", "#" + viewer.view);
    window.scrollTo(0, 0);
    draw();
  });
  viewer.selectView(location.hash.slice(1));

  // The page's own byte for a tap (1-255). The relay echoes it, so the page knows its own tap.
  function tapByte() {
    const b = new Uint8Array(1);
    do { crypto.getRandomValues(b); } while (b[0] === 0);
    return b[0];
  }

  // Writes one intent on the up characteristic. The relay holds it, signs it and retries it; the
  // page does not re-send. done(err) gets "" when the ground station took the write.
  function send(intent, done) {
    if (!up || viewer.ble !== "connected") {
      done("phone not connected to the ground station");
      return;
    }
    const ch = up;
    const bytes = GsEnvelope.encodeIntent(HTG4Msg, intent);
    writing = writing.then(function () {
      return (ch.writeValueWithResponse ? ch.writeValueWithResponse(bytes) : ch.writeValue(bytes));
    }).then(function () { done(""); }, function (e) { done(String(e.message || e)); });
  }

  // Unlock is signed by the relay and is not sent on LoRa. The page reads the 18 signed bytes
  // back from the up characteristic and writes them to the rocket (XIAO-LOG unlock).
  function sendUnlock(intent, done) {
    if (!up || viewer.ble !== "connected") {
      done("phone not connected to the ground station");
      return;
    }
    const ch = up;
    const bytes = GsEnvelope.encodeIntent(HTG4Msg, intent);
    writing = writing.then(function () {
      return (ch.writeValueWithResponse ? ch.writeValueWithResponse(bytes) : ch.writeValue(bytes)).then(function () {
        return ch.readValue();
      }).then(function (signed) {
        const raw = new Uint8Array(signed.buffer, signed.byteOffset, signed.byteLength);
        if (raw.length !== LogDownload.UNLOCK_BYTES) throw new Error("ground station did not return the signed unlock");
        return LogDownload.sendToRocket(raw);
      });
    }).then(function (reason) { done("", reason); }, function (e) { done(String(e.message || e)); });
  }

  // A tap on a page button: one intent, or a change to what the page shows (the Arm confirm step,
  // a find option, the unlock confirm step).
  document.addEventListener("click", function (ev) {
    const b = ev.target.closest("button[data-press]");
    if (!b) return;
    const intent = viewer.press(b.dataset.press, b.dataset.arg, new Date().toLocaleTimeString(), tapByte());
    draw();
    if (!intent) return;
    if (intent.via === "rocket-ble") {
      sendUnlock(intent, function (err, reason) {
        if (err) viewer.sent(err);
        else viewer.noteUnlock(reason);
        draw();
      });
      return;
    }
    send(intent, function (err) {
      viewer.sent(err);
      draw();
    });
  });

  // Once a second: ages count up, and the keepalive goes when it is due. A page in the background
  // sends no keepalive (PG-3); a closed page sends nothing.
  function tick() {
    if (viewer.keepaliveDue(now(), document.visibilityState === "visible")) {
      send(viewer.keepaliveIntent(now(), tapByte()), function (err) {
        viewer.keepaliveSent(err);
        draw();
      });
    }
    draw();
  }
  document.addEventListener("visibilitychange", tick);

  function hilTestMode() {
    const host = location.hostname;
    if (host !== "127.0.0.1" && host !== "localhost") return false;
    return new URLSearchParams(location.search).get("hil") === "1";
  }

  async function subscribe(dev) {
    setSt("connecting " + (dev.name || ""), "connecting");
    const server = await dev.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    const down = await svc.getCharacteristic(DOWN);
    try {
      up = await svc.getCharacteristic(UP);
    } catch (e) {
      up = null; // a ground station with no up characteristic: every tap reports not sent
    }
    await down.startNotifications();
    down.addEventListener("characteristicvaluechanged", function (ev) {
      if (ev.target.value) feed(GsEnvelope.parse(ev.target.value));
    });
    dev.addEventListener("gattserverdisconnected", function () {
      up = null;
      setSt("disconnected", "disconnected");
    });
    setSt("subscribed", "connected");
    try {
      feed(GsEnvelope.parse(await down.readValue()));
    } catch (e) { /* the notify path is enough */ }
  }

  async function connect() {
    if (!navigator.bluetooth) {
      setSt("no Web Bluetooth (need Chrome, HTTPS)", "idle");
      return;
    }
    try {
      if (hilTestMode()) {
        const wanted = new URLSearchParams(location.search).get("ble_name") || "";
        if (!wanted) {
          setSt("test mode: no device name", "idle");
          return;
        }
        if (typeof navigator.bluetooth.getDevices !== "function") {
          setSt("test mode: no getDevices", "idle");
          return;
        }
        setSt("test mode");
        const devices = await navigator.bluetooth.getDevices();
        const dev = devices.find(function (d) { return d.name === wanted; });
        if (!dev) {
          setSt("test mode: " + wanted + " is not granted", "idle");
          return;
        }
        await subscribe(dev);
        return;
      }
      setSt("picker...");
      const dev = await navigator.bluetooth.requestDevice({
        filters: [{ name: "XIAO-GS" }, { services: [SVC] }],
        optionalServices: [SVC],
      });
      await subscribe(dev);
    } catch (e) {
      setSt(String(e), "idle");
    }
  }

  $("btn").addEventListener("click", connect);
  setInterval(tick, 1000);
  draw();
  // Test hook (firmware/tests/gs/look_gs_web.js): show a prepared viewer at a fixed time, with no radio.
  // The selected view stays the page's own.
  window.GsPageTest = {
    show: function (v, atMs) {
      v.view = viewer.view;
      viewer = v;
      now = function () { return atMs; };
      draw();
    },
  };
})();
LogDownload.bind({ button: "log-btn", save: "log-save", view: "log-view", confirm: "log-confirm", discard: "log-discard", status: "log-st", error: "log-err" });
</script>
</body>
</html>
